name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker Typecheck & Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/ai-proxy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/ai-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run types:check && npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Worker bundle and migrations
        run: npx wrangler deploy --dry-run

  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build with the newest stable Xcode on the runner so CI tests the same
      # SDK generation the App Store build uses.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ShopwareApp.xcodeproj \
            -scheme ShopwareApp \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
